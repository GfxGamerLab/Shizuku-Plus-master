plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 26
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

afterEvaluate {
    def stubProject = subprojects.find { it.name == "stub" }
    def shellProject = subprojects.find { it.name == "shell" }
    if (stubProject != null && shellProject != null) {
        shellProject.tasks.configureEach { shellTask ->
            if (shellTask.name.contains("Release")) {
                stubProject.tasks.configureEach { stubTask ->
                    if (stubTask.name.contains("Release")) {
                        shellTask.mustRunAfter(stubTask)
                    }
                }
            }
            if (shellTask.name.contains("Debug")) {
                stubProject.tasks.configureEach { stubTask ->
                    if (stubTask.name.contains("Debug")) {
                        shellTask.mustRunAfter(stubTask)
                    }
                }
            }
        }
    }
}

ext {
    versionCode = 1
    versionName = "1.0.0"
}
